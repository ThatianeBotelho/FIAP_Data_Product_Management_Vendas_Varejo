dataContractSpecification: 0.9.3

id: urn:datacontract:olist:retail-sales:v1

info:
  title: Retail Sales Data Product - Olist
  version: 1.0.0
  status: active
  description: >
    Governed analytical Data Product for retail sales at Order + Product grain.
    Each row represents one product within one order.
  owner: Sales Analytics

servers:
  local:
    type: duckdb
    database: data/analytics.duckdb
    description: >
      Local DuckDB analytical database serving the retail_sales table.

models:
  retail_sales:
    description: >
      Retail sales fact table at Order + Product grain.
    type: table

    fields:
      sales_line_id:
        type: string
        required: true
        unique: true
        description: >
          Technical unique identifier built from order_id + product_id.

      sale_date:
        type: date
        required: true
        description: >
          Date when the customer placed the order.

      order_id:
        type: string
        required: true
        description: >
          Order identifier associated with the sales line.

      customer_id:
        type: string
        required: true
        description: >
          Anonymized unique customer identifier derived from customer_unique_id.

      product_id:
        type: string
        required: true
        description: >
          Product identifier associated with the order.

      quantity:
        type: integer
        required: true
        minimum: 1
        description: >
          Number of units of the product within the order.

      sales_amount:
        type: number
        required: true
        minimum: 0.01
        description: >
          Monetary value of the ordered items, calculated as the sum of item prices.
          Freight is not included.

      order_status:
        type: string
        required: true
        enum:
          - approved
          - canceled
          - created
          - delivered
          - invoiced
          - processing
          - shipped
          - unavailable
        description: >
          Current operational status of the order.

servicelevels:
  freshness:
    threshold: 24h
    description: >
      retail_sales must be refreshed within 24 hours of source availability.

  retention:
    period: 365d
    description: >
      Analytical history must remain available for at least 365 days.
