dataContractSpecification: 0.9.3

id: urn:datacontract:olist:retail-sales:v2-breaking

info:
  title: Retail Sales Data Product - Breaking Change Scenario
  version: 2.0.0
  status: draft
  description: >
    Deliberately incompatible Data Contract used to validate the Quality Gate
    against breaking schema and business-rule changes.
  owner: Sales Analytics

servers:
  local:
    type: duckdb
    database: data/analytics.duckdb

models:
  retail_sales:
    description: >
      retail_sales with intentionally incompatible constraints.
    type: table

    fields:
      sales_line_id:
        type: string
        required: true
        unique: true

      sale_date:
        type: date
        required: true

      order_id:
        type: string
        required: true

      customer_id:
        type: string
        required: true

      product_id:
        type: string
        required: true

      quantity:
        type: integer
        required: true
        minimum: 1

      sales_amount:
        type: number
        required: true
        minimum: 10000
        description: >
          Breaking Change: minimum threshold is intentionally incompatible
          with the current retail_sales data.

      order_status:
        type: string
        required: true
        enum:
          - delivered
        description: >
          Breaking Change: allowed domain was restricted to delivered only.

      sales_channel:
        type: string
        required: true
        description: >
          Breaking Change: new mandatory field added without backward compatibility.

servicelevels:
  freshness:
    threshold: 24h
    description: >
      retail_sales must be refreshed within 24 hours of source availability.

  retention:
    period: 365d
    description: >
      Analytical history must remain available for at least 365 days.
