dataContractSpecification: 0.9.3

id: urn:datacontract:olist:retail-sales:v1

info:

  title: Data Product de Vendas de Varejo Olist

  version: 1.0.0

  status: active

  description: >
    Data Product analítico governado que representa vendas
    de varejo no grão Pedido + Produto. Cada linha representa
    a venda de um produto específico dentro de um pedido.

  owner: Time de Sales Analytics

  contact:

    name: Time do Data Product

    email: data.product@example.com


servers:

  local:

    type: duckdb

    database: data/analytics.duckdb

    description: >
      Banco analítico local DuckDB contendo
      o Data Product retail_sales.


models:

  retail_sales:

    description: >
      Fato analítica de vendas no grão Pedido + Produto.

    type: table


    fields:


      sales_line_id:

        type: string

        required: true

        unique: true

        description: >
          Identificador técnico único da combinação
          Pedido + Produto.


      sale_date:

        type: date

        required: true

        description: >
          Data em que o cliente realizou o pedido.


      order_id:

        type: string

        required: true

        description: >
          Identificador do pedido associado à venda.


      customer_id:

        type: string

        required: true

        description: >
          Identificador anonimizado e único do cliente.


      product_id:

        type: string

        required: true

        description: >
          Identificador do produto vendido.


      quantity:

        type: integer

        required: true

        minimum: 1

        description: >
          Quantidade de unidades do produto dentro do pedido.


      sales_amount:

        type: number

        required: true

        minimum: 0.01

        description: >
          Valor monetário dos itens vendidos,
          calculado pela soma dos preços dos itens.
          O frete não está incluído.


      order_status:

        type: string

        required: true

        enum:

          - approved
          - canceled
          - created
          - delivered
          - invoiced
          - processing
          - shipped
          - unavailable

        description: >
          Status operacional atual do pedido.


servicelevels:

  freshness:

    threshold: 24h

    description: >
      No cenário operacional simulado,
      o Data Product deve ser atualizado
      em até 24 horas.


  retention:

    period: 365d

    description: >
      Os dados históricos devem permanecer
      disponíveis por pelo menos 365 dias.